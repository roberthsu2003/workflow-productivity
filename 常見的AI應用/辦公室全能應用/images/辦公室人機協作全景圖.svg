<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 400" width="100%" height="100%">
  <defs>
    <!-- Light Mode 背景漸層 (頂級白灰漸層) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- 卡片柔和淡陰影 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>

    <!-- 步驟 1 漸層 (天藍青) -->
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- 步驟 2 漸層 (靛紫) -->
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- 步驟 3 漸層 (琥珀橘黃) -->
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 步驟 4 漸層 (翡翠綠) -->
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- 箭頭標記 -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8" />
    </marker>
    <marker id="arrowhead-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284C7" />
    </marker>
  </defs>

  <!-- 整體明亮淺色背景 -->
  <rect width="1140" height="400" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 頂部標題區 (White Floating Header) -->
  <g transform="translate(40, 22)">
    <rect x="0" y="0" width="1060" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="24" cy="23" r="6" fill="#0284C7" />
    <circle cx="42" cy="23" r="6" fill="#6366F1" />
    <circle cx="60" cy="23" r="6" fill="#10B981" />
    
    <text x="84" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="15" font-weight="700" fill="#0F172A">
      AI Agent 辦公室全能應用：雙階段 Markdown 審核閉環全景架構
    </text>
    <text x="680" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="11.5" fill="#64748B">
      口語 ➔ 存為工作流.md (初審) ➔ AI產出規格書.md (終審) ➔ 產出最終產品
    </text>
  </g>

  <!-- 導引連接流線 (Connecting Flow Lines) -->
  <path d="M 285 220 L 325 220" stroke="#0284C7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-active)" />
  <path d="M 555 220 L 595 220" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-active)" />
  <path d="M 825 220 L 865 220" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-active)" />

  <!-- ==================== 模組 1: 零門檻多元輸入 ==================== -->
  <g transform="translate(40, 88)">
    <rect width="245" height="280" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="245" height="42" rx="14" fill="url(#step1Grad)" />
    <rect y="28" width="245" height="14" fill="url(#step1Grad)" />
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
      01. 零門檻輸入 (Input Layer)
    </text>

    <!-- 內容項目 1: 自然語言 -->
    <g transform="translate(14, 54)">
      <rect width="217" height="66" rx="8" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369A1">
        💬 日常口語白話交辦
      </text>
      <text x="12" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">
        非技術主管/行政零門檻提出需求
      </text>
    </g>

    <!-- 內容項目 2: 7大多元企業實體素材 -->
    <g transform="translate(14, 130)">
      <rect width="217" height="126" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0284C7">
        📦 7 種多模態實體素材
      </text>
      <text x="12" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">
        • 📕 PDF 企業規章 / 📄 Word 逐字稿
      </text>
      <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">
        • 📊 Excel 單據 / 📈 CSV 數據表
      </text>
      <text x="12" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">
        • 🖼️ 白板照片(OCR) / 📝 SOP.md
      </text>
      <text x="12" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748B">
        免寫代碼，拖曳直接餵入 AI Agent
      </text>
    </g>
  </g>

  <!-- ==================== 模組 2: Stage 1 產生 RTCCF 工作流 ==================== -->
  <g transform="translate(325, 88)">
    <rect width="230" height="280" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="230" height="42" rx="14" fill="url(#step2Grad)" />
    <rect y="28" width="230" height="14" fill="url(#step2Grad)" />
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
      02. RTCCF 工作流 (Stage 1)
    </text>

    <!-- 守則一卡片：儲存為工作流.md -->
    <g transform="translate(14, 54)">
      <rect width="202" height="114" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#DC2626">
        ⚠️ 守則一：存為 工作流.md
      </text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#991B1B">
        AI 自動轉為 RTCCF 交辦事項
      </text>
      <text x="10" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#374151">
        ✓ 具備角色/目標/情境/約束/格式
      </text>
      <text x="10" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#374151">
        ✓ 沉澱為可複用企業交辦工作流
      </text>
      <text x="10" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#4F46E5">
        必須儲存為 .md 檔案進行維護
      </text>
    </g>

    <!-- 使用者初審確認 -->
    <g transform="translate(14, 178)">
      <rect width="202" height="78" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4338CA">
        👤 使用者審核與確認
      </text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#374151">
        • 人機協作微調交辦步驟
      </text>
      <text x="10" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#1E40AF">
        ➔ 確認後傳給 AI 執行！
      </text>
    </g>
  </g>

  <!-- ==================== 模組 3: Stage 2 審核規格書 ==================== -->
  <g transform="translate(595, 88)">
    <rect width="230" height="280" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="230" height="42" rx="14" fill="url(#step3Grad)" />
    <rect y="28" width="230" height="14" fill="url(#step3Grad)" />
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
      03. 審核規格書 (Stage 2)
    </text>

    <!-- 守則二卡片：儲存為規格書.md -->
    <g transform="translate(14, 54)">
      <rect width="202" height="114" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#B45309">
        ⚠️ 守則二：存為 規格書.md
      </text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#78350F">
        AI 產生審核用規格書/卡片
      </text>
      <text x="10" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#451A03">
        • 章節字數預檢 / 數據金額平帳
      </text>
      <text x="10" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#451A03">
        • 簡報頁數動線 / 風控異常警示
      </text>
      <text x="10" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#D97706">
        亦必須存為 .md 做為驗收基準
      </text>
    </g>

    <!-- 人類終審決策放行 -->
    <g transform="translate(14, 178)">
      <rect width="202" height="78" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#92400E">
        🛡️ 人類終審放行決策
      </text>
      <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#78350F">
        人眼確認規格完全無誤後
      </text>
      <text x="10" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#B45309">
        回覆「審核通過」才正式產出！
      </text>
    </g>
  </g>

  <!-- ==================== 模組 4: 實體最終產品 ==================== -->
  <g transform="translate(865, 88)">
    <rect width="235" height="280" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect width="235" height="42" rx="14" fill="url(#step4Grad)" />
    <rect y="28" width="235" height="14" fill="url(#step4Grad)" />
    <text x="16" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF">
      04. 最終商務產品 (Deliverables)
    </text>

    <!-- 交付項目 1: Word & PDF -->
    <g transform="translate(12, 50)">
      <rect width="211" height="34" rx="6" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0369A1">
        📄 Word (.docx) &amp; 📕 PDF (.pdf)
      </text>
    </g>

    <!-- 交付項目 2: Excel -->
    <g transform="translate(12, 90)">
      <rect width="211" height="34" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#15803D">
        📊 Excel 試算表 (.xlsx 商業表)
      </text>
    </g>

    <!-- 交付項目 3: PPT -->
    <g transform="translate(12, 130)">
      <rect width="211" height="34" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#C2410C">
        📑 PowerPoint 簡報 (.pptx)
      </text>
    </g>

    <!-- 交付項目 4: 資訊圖表 -->
    <g transform="translate(12, 170)">
      <rect width="211" height="34" rx="6" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1" />
      <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#BE185D">
        🎨 資訊圖表 (Bento Box/蛇形SOP)
      </text>
    </g>

    <!-- 交付項目 5: 進階對齊模組 -->
    <g transform="translate(12, 210)">
      <rect width="211" height="52" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1.2" />
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#065F46">
        🎯 進階對齊：既有範本防護
      </text>
      <text x="10" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#047857">
        Word 證書佔位符 / Excel xltpl 公式保護
      </text>
    </g>
  </g>
</svg>

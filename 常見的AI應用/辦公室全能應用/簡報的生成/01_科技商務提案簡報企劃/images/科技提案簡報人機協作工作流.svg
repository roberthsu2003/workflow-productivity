<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 175" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>
  </defs>

  <style>
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 12.5px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
    .node-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 10.5px; fill: #475569; text-anchor: middle; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 10px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 9.5px; font-weight: 700; fill: #475569; text-anchor: middle; }
    .alert-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 10px; font-weight: 700; text-anchor: middle; }
  </style>

  <rect width="1020" height="175" rx="14" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 步驟 01 -->
  <g transform="translate(26, 16)">
    <rect width="215" height="142" rx="10" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="10" width="52" height="20" rx="6" fill="url(#step1)" />
    <text x="38" y="24" class="badge-text">01 輸入</text>
    <rect x="70" y="10" width="133" height="20" rx="6" fill="#F1F5F9" />
    <text x="136.5" y="24" class="pill-text">零門檻輸入</text>
    <text x="107.5" y="53" class="node-title">口述簡報需求</text>
    <text x="107.5" y="75" class="node-desc">向 AI 表達報告主題</text>
    <text x="107.5" y="93" class="node-desc">指定 8 頁高管決策提案</text>
    <rect x="12" y="106" width="191" height="25" rx="6" fill="#F0F9FF" />
    <text x="107.5" y="122.5" class="alert-text" fill="#0369A1">💬 零門檻日常口語</text>
  </g>
  <line x1="245" y1="87" x2="273" y2="87" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 02 -->
  <g transform="translate(277, 16)">
    <rect width="215" height="142" rx="10" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="10" width="52" height="20" rx="6" fill="url(#step2)" />
    <text x="38" y="24" class="badge-text">02 規格</text>
    <rect x="70" y="10" width="133" height="20" rx="6" fill="#F1F5F9" />
    <text x="136.5" y="24" class="pill-text">二合一 RTCCF 規格</text>
    <text x="107.5" y="53" class="node-title">RTCCF 與企劃規格書</text>
    <text x="107.5" y="75" class="node-desc">鎖定 One Slide, One Idea</text>
    <text x="107.5" y="93" class="node-desc">預檢 8 頁骨架與科技藍配色</text>
    <rect x="12" y="106" width="191" height="25" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <text x="107.5" y="122.5" class="alert-text" fill="#4338CA">💾 單檔存為 RTCCF規格書.md</text>
  </g>
  <line x1="496" y1="87" x2="524" y2="87" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 03 -->
  <g transform="translate(528, 16)">
    <rect width="215" height="142" rx="10" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="10" width="52" height="20" rx="6" fill="url(#step3)" />
    <text x="38" y="24" class="badge-text">03 審核</text>
    <rect x="70" y="10" width="133" height="20" rx="6" fill="#F1F5F9" />
    <text x="136.5" y="24" class="pill-text">單點審核放行</text>
    <text x="107.5" y="53" class="node-title">人類單點審核放行</text>
    <text x="107.5" y="75" class="node-desc">只審這一次！核對頁數邏輯</text>
    <text x="107.5" y="93" class="node-desc">確認 ROI 與資安防線亮點</text>
    <rect x="12" y="106" width="191" height="25" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
    <text x="107.5" y="122.5" class="alert-text" fill="#B45309">🛡️ 回覆「審核通過」才產出</text>
  </g>
  <line x1="747" y1="87" x2="775" y2="87" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 04 -->
  <g transform="translate(779, 16)">
    <rect width="215" height="142" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="10" width="52" height="20" rx="6" fill="url(#step4)" />
    <text x="38" y="24" class="badge-text">04 交付</text>
    <rect x="70" y="10" width="133" height="20" rx="6" fill="#F1F5F9" />
    <text x="136.5" y="24" class="pill-text">落地實體投影片</text>
    <text x="107.5" y="53" class="node-title">生成投影片大綱</text>
    <text x="107.5" y="75" class="node-desc">套用 PPT 母片模板</text>
    <text x="107.5" y="93" class="node-desc">或 Gamma 匯出 .pptx</text>
    <rect x="12" y="106" width="191" height="25" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1" />
    <text x="107.5" y="122.5" class="alert-text" fill="#065F46">📑 8 頁科技商務簡報</text>
  </g>
</svg>

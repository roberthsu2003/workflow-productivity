<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 441" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 14.5px; font-weight: 700; fill: #FFFFFF; }
    .meta-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 700; fill: #475569; }
    .meta-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 600; fill: #0F172A; }
    .sec-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12.5px; font-weight: 800; fill: #78350F; }
    .item-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .item-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 700; fill: #1E293B; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 11.5px; fill: #475569; }
    .alert-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 800; fill: #92400E; }
    .alert-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 11.5px; fill: #78350F; }
  </style>

  <g transform="translate(10, 10)">
    <rect width="740" height="421" rx="12" fill="url(#cardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#boxShadow)" />

    <!-- 頂部 Header -->
    <rect width="740" height="46" rx="12" fill="url(#headerGrad)" />
    <rect y="32" width="740" height="14" fill="url(#headerGrad)" />
    
    <circle cx="24" cy="23" r="5" fill="#FFFFFF" fill-opacity="0.6" />
    <circle cx="38" cy="23" r="5" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="56" y="28" class="title">🎙️ 會議逐字稿管理簡報審核規格書 (Meeting Review Card)</text>
    <rect x="620" y="13" width="100" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.2" />
    <text x="670" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">待初審確認</text>

    <!-- 中間元數據區 (Meta Info) -->
    <g transform="translate(24, 62)">
      <rect width="692" height="66" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="25" class="meta-label">來源依據：<tspan class="meta-val">數位轉型專案啟動會議音訊逐字稿.docx</tspan></text><text x="16" y="48" class="meta-label">提煉目標：<tspan class="meta-val">6 頁高階管理決策簡報大綱（去除口語贅字）</tspan></text><text x="440" y="48" class="meta-label">核心檢驗：<tspan class="meta-val">100% 事實 Grounding</tspan></text>
    </g>

    <!-- 項目清單區塊 -->
    <g transform="translate(24, 142)">
      <text x="4" y="14" class="sec-title">📋【核心架構與項目預覽】：</text>
      
      <!-- 項目 1 -->
      <g transform="translate(0, 26)">
        <rect width="20" height="18" rx="4" fill="#B45309" />
        <text x="10" y="13" class="item-num">1</text>
        <text x="28" y="14" class="item-bold">P1 會議背景與宗旨：<tspan class="item-desc">總經理致詞要點：推動全體非技術同仁 AI 賦能、提升營運綜效</tspan></text>
      </g>
      <!-- 項目 2 -->
      <g transform="translate(0, 52)">
        <rect width="20" height="18" rx="4" fill="#B45309" />
        <text x="10" y="13" class="item-num">2</text>
        <text x="28" y="14" class="item-bold">P2 四大部門核心需求：<tspan class="item-desc">需求盤點：行政公文撰寫、人資法規萃取、財務資料防呆、業務商務提案</tspan></text>
      </g>
      <!-- 項目 3 -->
      <g transform="translate(0, 78)">
        <rect width="20" height="18" rx="4" fill="#B45309" />
        <text x="10" y="13" class="item-num">3</text>
        <text x="28" y="14" class="item-bold">P3 工具選型優勢：<tspan class="item-desc">跨平台主流 AI Agent 工具特性對比與零授權成本採購策略</tspan></text>
      </g>
      <!-- 項目 4 -->
      <g transform="translate(0, 104)">
        <rect width="20" height="18" rx="4" fill="#B45309" />
        <text x="10" y="13" class="item-num">4</text>
        <text x="28" y="14" class="item-bold">P4 資安合規三大防線：<tspan class="item-desc">資安規範：嚴格事實查核、機敏資料分流脫敏、人機責任共擔</tspan></text>
      </g>
      <!-- 項目 5 -->
      <g transform="translate(0, 130)">
        <rect width="20" height="18" rx="4" fill="#B45309" />
        <text x="10" y="13" class="item-num">5</text>
        <text x="28" y="14" class="item-bold">P5 教育訓練推展時程：<tspan class="item-desc">時程規劃：5月中旬兩梯次種子實務工作坊、6月全面上線推廣</tspan></text>
      </g>
      <!-- 項目 6 -->
      <g transform="translate(0, 156)">
        <rect width="20" height="18" rx="4" fill="#B45309" />
        <text x="10" y="13" class="item-num">6</text>
        <text x="28" y="14" class="item-bold">P6 會議決議與行動交辦：<tspan class="item-desc">三大決議：成立專案推動小組、指派各部種子人員、建立成效回報</tspan></text>
      </g>
    </g>

    <!-- 底部待確認卡片 (Human-in-the-Loop Gate) -->
    <g transform="translate(24, 318)">
      <rect width="692" height="74" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" />
      <text x="16" y="22" class="alert-head">⚠️ 待確認事項（放行閘門）：</text>
      <text x="16" y="42" class="alert-body">• 上述 6 頁分頁安排是否完整涵蓋會議中主管指示與各部重要發言？</text><text x="16" y="61" class="alert-body">• 若確認無誤，請回覆【<tspan font-weight="800" fill="#92400E">審核通過，請產出完整投影片</tspan>】，AI 將為您輸出 6 頁精練簡報大綱。</text>
    </g>
  </g>
</svg>
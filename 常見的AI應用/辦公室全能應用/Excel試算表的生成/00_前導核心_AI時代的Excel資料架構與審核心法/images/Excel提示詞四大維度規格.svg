<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1D4ED8"/></linearGradient>
    <linearGradient id="d1Grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0369A1"/></linearGradient>
    <linearGradient id="d2Grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#4338CA"/></linearGradient>
    <linearGradient id="d3Grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#B45309"/></linearGradient>
    <linearGradient id="d4Grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; }
    .badge-text { font-size: 11px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .node-title { font-size: 13px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
    .node-desc { font-size: 11px; fill: #475569; }
  </style>

  <rect width="960" height="260" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Title Pill -->
  <g transform="translate(28, 16)">
    <rect width="400" height="30" rx="8" fill="url(#headGrad)" />
    <text x="200" y="20" class="font-sans" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">一份合格的 Excel 提示詞（Prompt 四大維度）</text>
  </g>

  <!-- 4 Columns -->
  <!-- Dim 1 -->
  <g transform="translate(28, 58)">
    <rect width="216" height="182" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="100" height="22" rx="5" fill="url(#d1Grad)" />
    <text x="62" y="27" class="font-sans badge-text">1️⃣ 工作表架構</text>
    <text x="108" y="60" class="font-sans node-title">Sheets 架構分工</text>
    
    <text x="14" y="86" class="font-sans node-desc">• 有幾個分頁？各自角色？</text>
    <text x="14" y="106" class="font-sans node-desc">• 明確拆分資料層與展示層</text>
    <text x="14" y="126" class="font-sans node-desc">• 主檔、明細表與統計看板</text>
    <text x="14" y="152" class="font-sans node-desc" fill="#0284C7" font-weight="700">💡 杜絕一頁混雜死報表</text>
  </g>

  <!-- Dim 2 -->
  <g transform="translate(256, 58)">
    <rect width="216" height="182" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="100" height="22" rx="5" fill="url(#d2Grad)" />
    <text x="62" y="27" class="font-sans badge-text">2️⃣ 欄位規格</text>
    <text x="108" y="60" class="font-sans node-title">Schema &amp; 型態</text>
    
    <text x="14" y="86" class="font-sans node-desc">• A~Z 欄依序定義名稱</text>
    <text x="14" y="106" class="font-sans node-desc">• 標註唯一的 ID 主鍵欄位</text>
    <text x="14" y="126" class="font-sans node-desc">• 限制格式：整數、日期、文字</text>
    <text x="14" y="152" class="font-sans node-desc" fill="#4F46E5" font-weight="700">💡 金額設為 #,##0 千分位</text>
  </g>

  <!-- Dim 3 -->
  <g transform="translate(484, 58)">
    <rect width="216" height="182" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="100" height="22" rx="5" fill="url(#d3Grad)" />
    <text x="62" y="27" class="font-sans badge-text">3️⃣ 公式運算邏輯</text>
    <text x="108" y="60" class="font-sans node-title">Formulas 運算</text>
    
    <text x="14" y="86" class="font-sans node-desc">• 嚴格禁止寫死純數值！</text>
    <text x="14" y="106" class="font-sans node-desc">• 指定 XLOOKUP 跨表串接</text>
    <text x="14" y="126" class="font-sans node-desc">• 指定 SUM / IFERROR 容錯</text>
    <text x="14" y="152" class="font-sans node-desc" fill="#D97706" font-weight="700">💡 確保數據能動態連動</text>
  </g>

  <!-- Dim 4 -->
  <g transform="translate(712, 58)">
    <rect width="216" height="182" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="100" height="22" rx="5" fill="url(#d4Grad)" />
    <text x="62" y="27" class="font-sans badge-text">4️⃣ 防呆與視覺規範</text>
    <text x="108" y="60" class="font-sans node-title">Validation &amp; Style</text>
    
    <text x="14" y="86" class="font-sans node-desc">• 關鍵欄位配置下拉選單</text>
    <text x="14" y="106" class="font-sans node-desc">• 條件格式化：超支紅字警示</text>
    <text x="14" y="126" class="font-sans node-desc">• 狀態顏色：延遲黃底/完成綠底</text>
    <text x="14" y="152" class="font-sans node-desc" fill="#059669" font-weight="700">💡 人性化介面與眼花抓漏</text>
  </g>
</svg>

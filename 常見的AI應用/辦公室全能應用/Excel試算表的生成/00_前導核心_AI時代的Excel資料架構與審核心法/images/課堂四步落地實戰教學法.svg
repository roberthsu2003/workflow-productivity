    <text x="128" y="68" class="desc">先不碰電腦！理清邏輯</text><text x="128" y="92" class="desc">拆分三張表與欄位型態</text>
    <rect x="476" y="14" width="210" height="32" rx="8" fill="#E9EFFD" stroke="#A7C0F7" stroke-width="1"/><text x="581" y="36" class="chip" fill="#2563EB">建立資料庫架構思維 🧠</text>
  </g>

    <rect x="476" y="14" width="210" height="32" rx="8" fill="#FBF1E6" stroke="#EFC89B" stroke-width="1"/><text x="581" y="36" class="chip" fill="#D97706">下令生成活 xlsx ⚡</text>
  </g>
  <line x1="380" y1="392" x2="380" y2="410" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>

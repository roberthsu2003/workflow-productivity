<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
    <linearGradient id="stepM1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="stepM2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="stepM3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#EA580C"/></linearGradient>
    <linearGradient id="stepM4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="stepM5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A855F7"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; }
    .badge-text { font-size: 10px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .node-title { font-size: 12.5px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
    .node-desc { font-size: 10px; fill: #475569; text-anchor: middle; }
  </style>

  <rect width="960" height="180" rx="14" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 模組 1 -->
  <g transform="translate(24, 18)">
    <rect width="162" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="10" y="10" width="62" height="20" rx="5" fill="url(#stepM1)" />
    <text x="41" y="24" class="font-sans badge-text">模組一</text>
    <text x="81" y="58" class="font-sans node-title">展示與資料分離</text>
    <text x="81" y="78" class="font-sans node-desc">三種工作表角色分工</text>
    <text x="81" y="96" class="font-sans node-desc">源表 · 參照 · 看板</text>
    <text x="81" y="118" class="font-sans node-desc" fill="#059669" font-weight="700">奠定活架構根基</text>
  </g>
  <line x1="190" y1="90" x2="208" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 模組 2 -->
  <g transform="translate(212, 18)">
    <rect width="162" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="10" y="10" width="62" height="20" rx="5" fill="url(#stepM2)" />
    <text x="41" y="24" class="font-sans badge-text">模組二</text>
    <text x="81" y="58" class="font-sans node-title">乾淨資料黃金法則</text>
    <text x="81" y="78" class="font-sans node-desc">四不二要原則</text>
    <text x="81" y="96" class="font-sans node-desc">零合併 · 純數值</text>
    <text x="81" y="118" class="font-sans node-desc" fill="#D97706" font-weight="700">確保電腦能解析</text>
  </g>
  <line x1="378" y1="90" x2="396" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 模組 3 -->
  <g transform="translate(400, 18)">
    <rect width="162" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="10" y="10" width="62" height="20" rx="5" fill="url(#stepM3)" />
    <text x="41" y="24" class="font-sans badge-text">模組三</text>
    <text x="81" y="58" class="font-sans node-title">看懂結構活死檔案</text>
    <text x="81" y="78" class="font-sans node-desc">動態公式與參照</text>
    <text x="81" y="96" class="font-sans node-desc">XLOOKUP / SUMIFS</text>
    <text x="81" y="118" class="font-sans node-desc" fill="#EA580C" font-weight="700">杜絕死數字報表</text>
  </g>
  <line x1="566" y1="90" x2="584" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 模組 4 -->
  <g transform="translate(588, 18)">
    <rect width="162" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="10" y="10" width="62" height="20" rx="5" fill="url(#stepM4)" />
    <text x="41" y="24" class="font-sans badge-text">模組四</text>
    <text x="81" y="58" class="font-sans node-title">下達表格規格書</text>
    <text x="81" y="78" class="font-sans node-desc">4大維度 Prompt</text>
    <text x="81" y="96" class="font-sans node-desc">分頁 · 欄位 · 公式 · 防呆</text>
    <text x="81" y="118" class="font-sans node-desc" fill="#0284C7" font-weight="700">工程級精準產出</text>
  </g>
  <line x1="754" y1="90" x2="772" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 模組 5 -->
  <g transform="translate(776, 18)">
    <rect width="162" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="10" y="10" width="62" height="20" rx="5" fill="url(#stepM5)" />
    <text x="41" y="24" class="font-sans badge-text">模組五</text>
    <text x="81" y="58" class="font-sans node-title">驗收除錯與樞紐</text>
    <text x="81" y="78" class="font-sans node-desc">Human-in-the-loop</text>
    <text x="81" y="96" class="font-sans node-desc">品管 QA · 錯誤代碼除錯</text>
    <text x="81" y="118" class="font-sans node-desc" fill="#7C3AED" font-weight="700">10 秒樞紐秒驗收</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <linearGradient id="badHeader" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#DC2626"/></linearGradient>
    <linearGradient id="goodHeader" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#F87171" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#34D399" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; }
    .col-title { font-size: 14px; font-weight: 800; }
    .step-box-title { font-size: 12px; font-weight: 700; }
    .step-box-desc { font-size: 11px; }
  </style>

  <!-- Container -->
  <rect width="960" height="330" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- LEFT COLUMN: Bad Cycle -->
  <g transform="translate(28, 22)">
    <rect width="438" height="286" rx="14" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2" filter="url(#shadow)" />
    
    <!-- Header -->
    <rect x="16" y="14" width="280" height="28" rx="7" fill="url(#badHeader)" />
    <text x="156" y="33" class="font-sans col-title" fill="#FFFFFF" text-anchor="middle">❌ 不懂觀念的惡性循環（盲目依賴）</text>

    <!-- Step 1 -->
    <g transform="translate(16, 54)">
      <rect width="406" height="52" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1" />
      <text x="14" y="24" class="font-sans step-box-title" fill="#991B1B">口語指令</text>
      <text x="74" y="24" class="font-sans step-box-desc" fill="#450A0A" font-weight="700">『幫我做一張銷售報表』</text>
      <text x="14" y="42" class="font-sans step-box-desc" fill="#7F1D1D">缺少工作表架構、欄位型態、防呆與公式定義</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="219" y1="106" x2="219" y2="124" stroke="#F87171" stroke-width="2" marker-end="url(#arrRed)" />

    <!-- Step 2 -->
    <g transform="translate(16, 126)">
      <rect width="406" height="56" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1" />
      <text x="14" y="23" class="font-sans step-box-title" fill="#991B1B">AI 自由發揮產出『死報表』</text>
      <text x="14" y="43" class="font-sans step-box-desc" fill="#7F1D1D">大量合併儲存格 · 金額打死值（無公式）· 一頁混雜流水帳與小計</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="219" y1="182" x2="219" y2="200" stroke="#F87171" stroke-width="2" marker-end="url(#arrRed)" />

    <!-- Step 3 -->
    <g transform="translate(16, 202)">
      <rect width="406" height="66" rx="8" fill="#FFFFFF" stroke="#F87171" stroke-width="1" />
      <text x="14" y="24" class="font-sans step-box-title" fill="#B91C1C">無法擴充分析 · 公式壞掉看不懂 😭</text>
      <text x="14" y="44" class="font-sans step-box-desc" fill="#991B1B">樞紐分析拉不出 · 篩選破圖 · 主管退件重新手動重打！</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Good Cycle -->
  <g transform="translate(494, 22)">
    <rect width="438" height="286" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2" filter="url(#shadow)" />
    
    <!-- Header -->
    <rect x="16" y="14" width="280" height="28" rx="7" fill="url(#goodHeader)" />
    <text x="156" y="33" class="font-sans col-title" fill="#FFFFFF" text-anchor="middle">✨ 掌握架構的心法循環（人機協同）</text>

    <!-- Step 1 -->
    <g transform="translate(16, 54)">
      <rect width="406" height="52" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
      <text x="14" y="24" class="font-sans step-box-title" fill="#166534">架構思維</text>
      <text x="74" y="24" class="font-sans step-box-desc" fill="#052E16" font-weight="700">展示與資料分離 + 四不二要黃金原則</text>
      <text x="14" y="42" class="font-sans step-box-desc" fill="#14532D">零合併儲存格 · 純數值千分位 · 一維表頭設計</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="219" y1="106" x2="219" y2="124" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)" />

    <!-- Step 2 -->
    <g transform="translate(16, 126)">
      <rect width="406" height="56" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1" />
      <text x="14" y="23" class="font-sans step-box-title" fill="#166534">下達四維度『表格規格書 Prompt』</text>
      <text x="14" y="43" class="font-sans step-box-desc" fill="#14532D">明確指定：分頁結構 · 欄位規格 · 動態公式 (XLOOKUP) · 防呆驗證</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="219" y1="182" x2="219" y2="200" stroke="#34D399" stroke-width="2" marker-end="url(#arrGreen)" />

    <!-- Step 3 -->
    <g transform="translate(16, 202)">
      <rect width="406" height="66" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1" />
      <text x="14" y="24" class="font-sans step-box-title" fill="#047857">AI 產出活架構 ➔ 人類 10 秒品管驗收 🚀</text>
      <text x="14" y="44" class="font-sans step-box-desc" fill="#065F46">點擊公式編輯列確認公式 · 一鍵拖拉樞紐分析與動態商務看板！</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" height="100%">
  <defs>
    <!-- 背景白灰漸層 -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- 頂部 Header 漸層 -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .meta-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 700; fill: #475569; }
    .meta-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 600; fill: #0F172A; }
    .sec-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12.5px; font-weight: 800; fill: #0369A1; }
    .item-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .item-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 700; fill: #1E293B; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 11.5px; fill: #475569; }
    .alert-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 12px; font-weight: 800; fill: #92400E; }
    .alert-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; font-size: 11.5px; fill: #78350F; }
  </style>

  <!-- 卡片主體外框 -->
  <g transform="translate(10, 10)">
    <rect width="740" height="430" rx="12" fill="url(#cardBg)" stroke="#CBD5E1" stroke-width="1.2" filter="url(#boxShadow)" />

    <!-- 頂部 Header -->
    <rect width="740" height="46" rx="12" fill="url(#headerGrad)" />
    <rect y="32" width="740" height="14" fill="url(#headerGrad)" />
    
    <circle cx="24" cy="23" r="5" fill="#38BDF8" />
    <circle cx="38" cy="23" r="5" fill="#818CF8" />
    <text x="56" y="28" class="title">📑 專案計畫書架構規格書 (Review Specification)</text>
    <rect x="625" y="13" width="95" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.2" />
    <text x="672" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">待初審確認</text>

    <!-- 中間元數據區 (Meta Info) -->
    <g transform="translate(24, 62)">
      <rect width="692" height="66" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="25" class="meta-label">專案名稱：<tspan class="meta-val">2026 年度辦公室 AI 賦能推動計畫書</tspan></text>
      <text x="16" y="48" class="meta-label">預計格式：<tspan class="meta-val">Word (.docx) / PDF (.pdf)</tspan></text>
      <text x="360" y="48" class="meta-label">預估字數：<tspan class="meta-val">約 1,500 ~ 1,800 字（標準 6 大章節）</tspan></text>
    </g>

    <!-- 章節骨架區塊 -->
    <g transform="translate(24, 142)">
      <text x="4" y="14" class="sec-title">📋【6 大章節骨架預覽】：</text>

      <!-- 項目 1 -->
      <g transform="translate(0, 26)">
        <rect width="20" height="18" rx="4" fill="#0284C7" />
        <text x="10" y="13" class="item-num">1</text>
        <text x="28" y="14" class="item-bold">計畫緣起：<tspan class="item-desc">當前行政文書 3 大痛點與工時浪費分析</tspan></text>
      </g>

      <!-- 項目 2 -->
      <g transform="translate(0, 52)">
        <rect width="20" height="18" rx="4" fill="#0284C7" />
        <text x="10" y="13" class="item-num">2</text>
        <text x="28" y="14" class="item-bold">推動目標：<tspan class="item-desc">三大核心 KPI（例行行政提速 40%、零資安違規）</tspan></text>
      </g>

      <!-- 項目 3 -->
      <g transform="translate(0, 78)">
        <rect width="20" height="18" rx="4" fill="#0284C7" />
        <text x="10" y="13" class="item-num">3</text>
        <text x="28" y="14" class="item-bold">實施階段：<tspan class="item-desc">4月資安檢測 ➔ 5月中旬種子培訓 ➔ 6月全面推廣</tspan></text>
      </g>

      <!-- 項目 4 -->
      <g transform="translate(0, 104)">
        <rect width="20" height="18" rx="4" fill="#0284C7" />
        <text x="10" y="13" class="item-num">4</text>
        <text x="28" y="14" class="item-bold">資安防護：<tspan class="item-desc">三大原則（查核、分流、負責）與個資脫敏規範</tspan></text>
      </g>

      <!-- 項目 5 -->
      <g transform="translate(0, 130)">
        <rect width="20" height="18" rx="4" fill="#0284C7" />
        <text x="10" y="13" class="item-num">5</text>
        <text x="28" y="14" class="item-bold">資源預算：<tspan class="item-desc">零軟體授權成本（採用合規方案）+ 教育訓練場地費</tspan></text>
      </g>

      <!-- 項目 6 -->
      <g transform="translate(0, 156)">
        <rect width="20" height="18" rx="4" fill="#0284C7" />
        <text x="10" y="13" class="item-num">6</text>
        <text x="28" y="14" class="item-bold">預期效益：<tspan class="item-desc">投資報酬率 (ROI) 預估與總結成效</tspan></text>
      </g>
    </g>

    <!-- 底部待確認卡片 (Human-in-the-Loop Gate) -->
    <g transform="translate(24, 336)">
      <rect width="692" height="74" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2" />
      <text x="16" y="22" class="alert-head">⚠️ 待確認事項（放行閘門）：</text>
      <text x="16" y="42" class="alert-body">• 上述 6 大章節結構與 KPI 設定是否符合您的需求？</text>
      <text x="16" y="61" class="alert-body">• 若確認無誤，請回覆【<tspan font-weight="800" fill="#92400E">確認無誤，可以生成</tspan>】，AI 將為您正式產出全文。</text>
    </g>
  </g>
</svg>

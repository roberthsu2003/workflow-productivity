<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E11D48"/><stop offset="100%" stop-color="#F43F5E"/></linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; }
    .badge-text { font-size: 10px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .node-title { font-size: 11.5px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
    .node-owner { font-size: 10px; font-weight: 700; text-anchor: middle; }
    .node-desc { font-size: 9.5px; fill: #64748B; text-anchor: middle; }
  </style>

  <rect width="1020" height="180" rx="14" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- 步驟 1 -->
  <g transform="translate(18, 18)">
    <rect width="144" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="46" height="20" rx="5" fill="url(#grad1)" />
    <text x="31" y="24" class="font-sans badge-text">01</text>
    <text x="72" y="56" class="font-sans node-title">報到與身分確認</text>
    <rect x="22" y="70" width="100" height="20" rx="5" fill="#E0F2FE" />
    <text x="72" y="84" class="font-sans node-owner" fill="#0369A1">窗口：HR 人資</text>
    <text x="72" y="108" class="font-sans node-desc">繳交證件資料</text>
    <text x="72" y="124" class="font-sans node-desc">領取識別門禁卡</text>
  </g>
  <line x1="165" y1="90" x2="182" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 2 -->
  <g transform="translate(186, 18)">
    <rect width="144" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="46" height="20" rx="5" fill="url(#grad2)" />
    <text x="31" y="24" class="font-sans badge-text">02</text>
    <text x="72" y="56" class="font-sans node-title">IT 設備帳號領用</text>
    <rect x="22" y="70" width="100" height="20" rx="5" fill="#EEF2FF" />
    <text x="72" y="84" class="font-sans node-owner" fill="#4338CA">窗口：資訊部門</text>
    <text x="72" y="108" class="font-sans node-desc">公司信箱 &amp; ERP</text>
    <text x="72" y="124" class="font-sans node-desc">筆電設備點交</text>
  </g>
  <line x1="333" y1="90" x2="350" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 3 -->
  <g transform="translate(354, 18)">
    <rect width="144" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="46" height="20" rx="5" fill="url(#grad3)" />
    <text x="31" y="24" class="font-sans badge-text">03</text>
    <text x="72" y="56" class="font-sans node-title">導師介紹與環境</text>
    <rect x="22" y="70" width="100" height="20" rx="5" fill="#FEF3C7" />
    <text x="72" y="84" class="font-sans node-owner" fill="#B45309">窗口：部門主管</text>
    <text x="72" y="108" class="font-sans node-desc">指派 1 對 1 導師</text>
    <text x="72" y="124" class="font-sans node-desc">熟悉團隊辦公區</text>
  </g>
  <line x1="501" y1="90" x2="518" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 4 -->
  <g transform="translate(522, 18)">
    <rect width="144" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="46" height="20" rx="5" fill="url(#grad4)" />
    <text x="31" y="24" class="font-sans badge-text">04</text>
    <text x="72" y="56" class="font-sans node-title">規章考核與線上</text>
    <rect x="22" y="70" width="100" height="20" rx="5" fill="#FFE4E6" />
    <text x="72" y="84" class="font-sans node-owner" fill="#BE123C">窗口：人資部門</text>
    <text x="72" y="108" class="font-sans node-desc">資安規範線上測驗</text>
    <text x="72" y="124" class="font-sans node-desc">差旅請假權益學習</text>
  </g>
  <line x1="669" y1="90" x2="686" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 5 -->
  <g transform="translate(690, 18)">
    <rect width="144" height="144" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="46" height="20" rx="5" fill="url(#grad5)" />
    <text x="31" y="24" class="font-sans badge-text">05</text>
    <text x="72" y="56" class="font-sans node-title">首週任務交辦</text>
    <rect x="22" y="70" width="100" height="20" rx="5" fill="#F3E8FF" />
    <text x="72" y="84" class="font-sans node-owner" fill="#7E22CE">窗口：指定導師</text>
    <text x="72" y="108" class="font-sans node-desc">小型實戰專案演練</text>
    <text x="72" y="124" class="font-sans node-desc">每日晨會進度同步</text>
  </g>
  <line x1="837" y1="90" x2="854" y2="90" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" />

  <!-- 步驟 6 -->
  <g transform="translate(858, 18)">
    <rect width="144" height="144" rx="10" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.2" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="46" height="20" rx="5" fill="url(#grad6)" />
    <text x="31" y="24" class="font-sans badge-text">06</text>
    <text x="72" y="56" class="font-sans node-title">第七天訪談考核</text>
    <rect x="22" y="70" width="100" height="20" rx="5" fill="#DCFCE7" />
    <text x="72" y="84" class="font-sans node-owner" fill="#15803D">窗口：HR &amp; 主管</text>
    <text x="72" y="108" class="font-sans node-desc">雙向回饋訪談</text>
    <text x="72" y="124" class="font-sans node-desc" fill="#059669" font-weight="700">正式融入團隊 🚀</text>
  </g>
</svg>

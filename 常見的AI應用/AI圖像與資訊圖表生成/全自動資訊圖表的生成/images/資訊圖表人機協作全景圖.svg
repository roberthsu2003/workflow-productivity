<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F1F5F9"/></linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/></filter>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284C7"/><stop offset="100%" stop-color="#41A2D5"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#7B74EB"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#9C6BF1"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#D97706"/><stop offset="100%" stop-color="#E29944"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#43B08E"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94A3B8"/></marker>
  </defs>
  <style>
    .num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 30px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; }
    .num-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 22px; font-weight: 800; fill: #0F172A; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 16px; fill: #475569; }
    .chip { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  </style>
  <rect width="760" height="672" rx="16" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.2"/>
  <g transform="translate(30, 24)">
    <rect width="700" height="104" rx="12" fill="#FFFFFF" stroke="#99CDE8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="104" height="104" rx="12" fill="url(#g1)"/>
    <text x="52" y="50" class="num">01</text><text x="52" y="78" class="num-label">輸入</text>
    <text x="128" y="40" class="title">白話口語交辦</text>
    <text x="128" y="68" class="desc">口述宣傳內容或上傳 SOP</text><text x="128" y="92" class="desc">指定資訊圖表需求</text>
    <rect x="476" y="14" width="210" height="32" rx="8" fill="#E5F2F9" stroke="#99CDE8" stroke-width="1"/><text x="581" y="36" class="chip" fill="#0284C7">💬 零門檻輸入</text>
  </g>
  <line x1="380" y1="132" x2="380" y2="150" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <g transform="translate(30, 154)">
    <rect width="700" height="104" rx="12" fill="#FFFFFF" stroke="#B8B5F4" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="104" height="104" rx="12" fill="url(#g2)"/>
    <text x="52" y="50" class="num">02</text><text x="52" y="78" class="num-label">存檔</text>
    <text x="128" y="40" class="title">轉化 RTCCF 規範</text>
    <text x="128" y="68" class="desc">設定資訊設計師角色</text><text x="128" y="92" class="desc">鎖定動線與視覺風格</text>
    <rect x="476" y="14" width="210" height="32" rx="8" fill="#EDECFC" stroke="#B8B5F4" stroke-width="1"/><text x="581" y="36" class="chip" fill="#4F46E5">💾 存為 工作流.md</text>
  </g>
  <line x1="380" y1="262" x2="380" y2="280" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <g transform="translate(30, 284)">
    <rect width="700" height="104" rx="12" fill="#FFFFFF" stroke="#CAB0F7" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="104" height="104" rx="12" fill="url(#g3)"/>
    <text x="52" y="50" class="num">03</text><text x="52" y="78" class="num-label">規格</text>
    <text x="128" y="40" class="title">AI 輸出視覺設計規格書</text>
    <text x="128" y="68" class="desc">動線／網格／色票審核</text><text x="128" y="92" class="desc">人眼預檢模組規劃</text>
    <rect x="476" y="14" width="210" height="32" rx="8" fill="#F1EBFD" stroke="#CAB0F7" stroke-width="1"/><text x="581" y="36" class="chip" fill="#7C3AED">💾 存為 規格書.md</text>
  </g>
  <line x1="380" y1="392" x2="380" y2="410" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <g transform="translate(30, 414)">
    <rect width="700" height="104" rx="12" fill="#FCF5ED" stroke="#D97706" stroke-width="2" filter="url(#cardShadow)"/>
    <rect width="104" height="104" rx="12" fill="url(#g4)"/>
    <text x="52" y="50" class="num">04</text><text x="52" y="78" class="num-label">審核</text>
    <text x="128" y="40" class="title">放行閘門查核</text>
    <text x="128" y="68" class="desc">核對版面模組正確性</text><text x="128" y="92" class="desc">發送：確認無誤，可以生成</text>
    <rect x="476" y="14" width="210" height="32" rx="8" fill="#FBF1E6" stroke="#EFC89B" stroke-width="1"/><text x="581" y="36" class="chip" fill="#D97706">🛡️ 人類終審放行</text>
  </g>
  <line x1="380" y1="522" x2="380" y2="540" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arr)"/>
  <g transform="translate(30, 544)">
    <rect width="700" height="104" rx="12" fill="#FFFFFF" stroke="#9BD5C3" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="104" height="104" rx="12" fill="url(#g5)"/>
    <text x="52" y="50" class="num">05</text><text x="52" y="78" class="num-label">交付</text>
    <text x="128" y="40" class="title">產出視覺圖表成品</text>
    <text x="128" y="68" class="desc">輸出 HTML / SVG 卡片</text><text x="128" y="92" class="desc">或 Mermaid / Canva</text>
    <rect x="476" y="14" width="210" height="32" rx="8" fill="#E6F4F0" stroke="#9BD5C3" stroke-width="1"/><text x="581" y="36" class="chip" fill="#059669">🎨 落地成品</text>
  </g>
</svg>

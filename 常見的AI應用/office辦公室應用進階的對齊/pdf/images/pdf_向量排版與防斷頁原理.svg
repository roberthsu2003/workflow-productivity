<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" width="1040" height="580" font-family="'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="1040" height="580" rx="16" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="24" y="20" width="992" height="64" rx="12" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="520" y="48" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">PDF (.pdf) 向量排版規格與跨頁防斷裂原理</text>
  <text x="520" y="72" text-anchor="middle" fill="#ccfbf1" font-size="13">為什麼 PDF 不用「文字佔位符」？因為 PDF 沒有文字重排引擎，必須靠 ReportLab 規格書精準生成！</text>

  <!-- Step 1: Left Card (Layout Spec) -->
  <g transform="translate(28, 108)" filter="url(#shadow)">
    <rect width="300" height="350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="300" height="40" rx="12" fill="#e0e7ff"/>
    <rect y="28" width="300" height="12" fill="#e0e7ff"/>
    <text x="150" y="26" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="700">① 定義 A4 排版規格書 (Spec)</text>

    <!-- A4 Spec diagram -->
    <rect x="34" y="54" width="232" height="148" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="150" y="72" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">A4 寬 210mm（左右邊界各 18mm）</text>
    <line x1="46" y1="82" x2="254" y2="82" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="150" y="96" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="700">← 可用表格總寬 = 174mm →</text>

    <!-- Col width grid -->
    <rect x="46" y="106" width="24" height="26" fill="#1e3a8a"/>
    <rect x="70" y="106" width="34" height="26" fill="#1e40af"/>
    <rect x="104" y="106" width="36" height="26" fill="#1d4ed8"/>
    <rect x="140" y="106" width="58" height="26" fill="#2563eb"/>
    <rect x="198" y="106" width="26" height="26" fill="#1d4ed8"/>
    <rect x="224" y="106" width="30" height="26" fill="#1e3a8a"/>
    <text x="58" y="122" text-anchor="middle" fill="#ffffff" font-size="8">14</text>
    <text x="87" y="122" text-anchor="middle" fill="#ffffff" font-size="8">24</text>
    <text x="122" y="122" text-anchor="middle" fill="#ffffff" font-size="8">28</text>
    <text x="169" y="122" text-anchor="middle" fill="#ffffff" font-size="8">64mm</text>
    <text x="211" y="122" text-anchor="middle" fill="#ffffff" font-size="8">20</text>
    <text x="239" y="122" text-anchor="middle" fill="#ffffff" font-size="8">24</text>

    <text x="150" y="152" text-anchor="middle" fill="#334155" font-size="10">• 金額／數量欄位：TA_RIGHT 靠右對齊</text>
    <text x="150" y="169" text-anchor="middle" fill="#334155" font-size="10">• 摘要欄位：包進 Paragraph 自動折行</text>
    <text x="150" y="186" text-anchor="middle" fill="#334155" font-size="10">• 簽核區塊：KeepTogether 防撕裂</text>

    <text x="20" y="226" fill="#0f172a" font-size="12.5" font-weight="700">為什麼不直接改舊 PDF 文字？</text>
    <text x="20" y="248" fill="#334155" font-size="12">• PDF 紀錄的是絕對座標 (x, y)</text>
    <text x="20" y="268" fill="#334155" font-size="12">• 硬塞長文字不會換行，會直接重疊</text>
    <text x="20" y="288" fill="#334155" font-size="12">• 用規格書＋資料檔重新生成才最穩</text>

    <rect x="18" y="304" width="264" height="34" rx="6" fill="#fee2e2" stroke="#ef4444"/>
    <text x="150" y="325" text-anchor="middle" fill="#991b1b" font-size="11.5" font-weight="700">⚠ 沒註冊中文字型會變成 □□□ 豆腐字！</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="334" y1="283" x2="366" y2="283" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Center Card (ReportLab Engine) -->
  <g transform="translate(372, 108)" filter="url(#shadow)">
    <rect width="300" height="350" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <rect width="300" height="40" rx="12" fill="#ccfbf1"/>
    <rect y="28" width="300" height="12" fill="#ccfbf1"/>
    <text x="150" y="26" text-anchor="middle" fill="#115e59" font-size="15" font-weight="700">② ReportLab 向量排版引擎</text>

    <rect x="16" y="54" width="268" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="75" fill="#0f766e" font-size="13" font-weight="700">1. 註冊繁中 TTFont 字型</text>
    <text x="28" y="95" fill="#334155" font-size="11.5">pdfmetrics.registerFont(TTFont(...))</text>
    <text x="28" y="113" fill="#475569" font-size="11">嵌入 Arial Unicode / 微軟正黑體 / 思源黑體</text>

    <rect x="16" y="138" width="268" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="159" fill="#0f766e" font-size="13" font-weight="700">2. repeatRows=1 自動重複表頭</text>
    <text x="28" y="179" fill="#334155" font-size="11.5">明細超過 1 頁自動換頁</text>
    <text x="28" y="197" fill="#475569" font-size="11">第 2 頁頂端自動補上深藍表頭列</text>

    <rect x="16" y="222" width="268" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="243" fill="#0f766e" font-size="13" font-weight="700">3. KeepTogether ＋ 雙遍頁碼</text>
    <text x="28" y="263" fill="#334155" font-size="11.5">簽核區整塊移動，絕不切成兩半</text>
    <text x="28" y="281" fill="#475569" font-size="11">NumberedCanvas 繪製「第 X 頁 / 共 Y 頁」</text>

    <rect x="16" y="314" width="268" height="24" rx="6" fill="#f0fdfa"/>
    <text x="150" y="330" text-anchor="middle" fill="#115e59" font-size="11" font-weight="700">核心套件：reportlab ＋ pypdf（合併/書籤）</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="678" y1="283" x2="710" y2="283" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Step 3: Right Card (2-Page Output) -->
  <g transform="translate(716, 108)" filter="url(#shadow)">
    <rect width="296" height="350" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="296" height="40" rx="12" fill="#d1fae5"/>
    <rect y="28" width="296" height="12" fill="#d1fae5"/>
    <text x="148" y="26" text-anchor="middle" fill="#065f46" font-size="15" font-weight="700">③ 跨頁不跑版的向量 PDF</text>

    <!-- Mini Page 1 & Page 2 -->
    <rect x="20" y="54" width="120" height="150" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <text x="80" y="68" text-anchor="middle" fill="#1e3a8a" font-size="8.5" font-weight="700">Page 1</text>
    <rect x="28" y="76" width="104" height="14" fill="#1e3a8a"/>
    <text x="80" y="86" text-anchor="middle" fill="#ffffff" font-size="7.5">項次 | 摘要 | 金額</text>
    <rect x="28" y="92" width="104" height="82" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="34" y="108" fill="#475569" font-size="7.5">1. 台北-高雄高鐵</text>
    <text x="126" y="108" text-anchor="end" fill="#0f172a" font-size="7.5">2,980</text>
    <text x="34" y="124" fill="#475569" font-size="7.5">2. 商務飯店住宿</text>
    <text x="126" y="124" text-anchor="end" fill="#0f172a" font-size="7.5">3,600</text>
    <text x="80" y="150" text-anchor="middle" fill="#94a3b8" font-size="8">...（自動換頁）...</text>
    <text x="128" y="196" text-anchor="end" fill="#64748b" font-size="7">第 1 頁 / 共 2 頁</text>

    <rect x="156" y="54" width="120" height="150" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <text x="216" y="68" text-anchor="middle" fill="#065f46" font-size="8.5" font-weight="700">Page 2（自動重複表頭）</text>
    <rect x="164" y="76" width="104" height="14" fill="#1e3a8a"/>
    <text x="216" y="86" text-anchor="middle" fill="#fde047" font-size="7.5">項次 | 摘要 | 金額</text>
    <rect x="164" y="92" width="104" height="44" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="170" y="108" fill="#475569" font-size="7.5">18. 辦公區清潔耗材</text>
    <text x="262" y="108" text-anchor="end" fill="#0f172a" font-size="7.5">1,150</text>
    <rect x="164" y="122" width="104" height="14" fill="#dbeafe"/>
    <text x="262" y="132" text-anchor="end" fill="#1e3a8a" font-size="7.5" font-weight="700">合計 NT$ 39,889</text>
    <!-- KeepTogether Signature -->
    <rect x="164" y="146" width="104" height="32" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="216" y="165" text-anchor="middle" fill="#334155" font-size="7.5">申請人 / 主管 / 財務簽核</text>
    <text x="264" y="196" text-anchor="end" fill="#64748b" font-size="7">第 2 頁 / 共 2 頁</text>

    <text x="20" y="228" fill="#065f46" font-size="12.5" font-weight="700">驗收 3 大關鍵指標：</text>
    <text x="20" y="250" fill="#334155" font-size="12">✅ 繁中字型清晰銳利，零豆腐字</text>
    <text x="20" y="270" fill="#334155" font-size="12">✅ 金額千分位右對齊，垂直成一直線</text>
    <text x="20" y="290" fill="#334155" font-size="12">✅ 跨頁表頭自動重複，簽核區不撕裂</text>

    <rect x="18" y="304" width="260" height="34" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="148" y="325" text-anchor="middle" fill="#065f46" font-size="11.5" font-weight="700">✨ 財務／公文最可靠的向量輸出</text>
  </g>

  <!-- Bottom Package Bar -->
  <g transform="translate(28, 476)" filter="url(#shadow)">
    <rect width="984" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="24" y="28" fill="#0f172a" font-size="14" font-weight="700">🧰 課堂必備 Python 套件一覽</text>
    <text x="24" y="50" fill="#334155" font-size="12.5">
      <tspan font-weight="700" fill="#0f766e">1. reportlab</tspan>（A4 向量排版、Table repeatRows、KeepTogether、TTFont 嵌入）　
      <tspan font-weight="700" fill="#0f766e">2. pypdf</tspan>（合併 PDF、加入階層書籤、檢查頁數）
    </text>
    <text x="24" y="70" fill="#64748b" font-size="11.5">安裝指令：uv run --with reportlab --with pypdf python render_pdf.py（或 pip install reportlab pypdf）</text>
  </g>
</svg>

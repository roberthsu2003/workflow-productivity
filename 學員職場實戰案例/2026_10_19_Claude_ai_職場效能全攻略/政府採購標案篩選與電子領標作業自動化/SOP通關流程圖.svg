<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 780" width="100%" height="100%">
  <defs>
    <!-- 亮色風格漸層定義 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- 序號徽章漸層 -->
    <linearGradient id="badge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="badge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="badge3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="badge4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="badge5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- 亮色精緻卡片投影 -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; font-size: 16px; fill: #0f172a; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 400; font-size: 12.5px; fill: #475569; }
    .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 12.5px; }
  </style>

  <!-- 主背景底板（清新亮色） -->
  <rect x="0" y="0" width="920" height="780" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 頂部標題區 -->
  <text x="460" y="44" class="main-title" text-anchor="middle" letter-spacing="0.8">🧭 漸進式優化通關地圖：政府標案五階段閉環 SOP</text>
  <text x="460" y="68" class="sub-title" text-anchor="middle">需求發想 ➔ 採購網清洗 ➔ 技術評估分流 ➔ 憑據合格查核 ➔ 台帳配號歸檔 ➔ 總表與異動閉環</text>

  <!-- 連接導引箭頭線 -->
  <g stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="4 3" fill="none">
    <path d="M 460, 185 L 460, 215" />
    <path d="M 460, 310 L 460, 340" />
    <path d="M 460, 435 L 460, 465" />
    <path d="M 460, 560 L 460, 590" />
  </g>
  <polygon points="456,215 464,215 460,222" fill="#64748b" />
  <polygon points="456,340 464,340 460,347" fill="#64748b" />
  <polygon points="456,465 464,465 460,472" fill="#64748b" />
  <polygon points="456,590 464,590 460,597" fill="#64748b" />

  <!-- ================= 關卡 1 ================= -->
  <g transform="translate(50, 95)">
    <rect width="820" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#0284c7" />
    <circle cx="48" cy="45" r="22" fill="url(#badge1)" />
    <text x="48" y="51" class="badge-num" text-anchor="middle">01</text>
    <text x="86" y="38" class="card-title">【關卡 1】標案查詢需求定義與等標期篩選清洗</text>
    <text x="86" y="64" class="card-desc">自然語言發想產出首版規格書，過濾等標期與勞務類，排重並標註不足3日急件</text>
    <rect x="685" y="28" width="115" height="34" rx="17" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" />
    <text x="742" y="50" class="pill-text" fill="#0369a1" text-anchor="middle">RTCCF_v1.md</text>
  </g>

  <!-- ================= 關卡 2 ================= -->
  <g transform="translate(50, 220)">
    <rect width="820" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#8b5cf6" />
    <circle cx="48" cy="45" r="22" fill="url(#badge2)" />
    <text x="48" y="51" class="badge-num" text-anchor="middle">02</text>
    <text x="86" y="38" class="card-title">【關卡 2】技術部評估決策矩陣與領標指示授權</text>
    <text x="86" y="64" class="card-desc">技術部四分法勾選決策（爭取/參考/待確認/不採用），指派專案承辦人與領標指示</text>
    <rect x="685" y="28" width="115" height="34" rx="17" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" />
    <text x="742" y="50" class="pill-text" fill="#6d28d9" text-anchor="middle">更新 RTCCF_v1</text>
  </g>

  <!-- ================= 關卡 3 ================= -->
  <g transform="translate(50, 345)">
    <rect width="820" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#059669" />
    <circle cx="48" cy="45" r="22" fill="url(#badge3)" />
    <text x="48" y="51" class="badge-num" text-anchor="middle">03</text>
    <text x="86" y="38" class="card-title">【關卡 3】電子領標防重查核與憑據合格性審查</text>
    <text x="86" y="64" class="card-desc">查核公司既有紀錄防重複付款，強效稽核 .tkn 憑據存在性與招標文件解壓縮完整度</text>
    <rect x="685" y="28" width="115" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="742" y="50" class="pill-text" fill="#047857" text-anchor="middle">更新 RTCCF_v1</text>
  </g>

  <!-- ================= 關卡 4 ================= -->
  <g transform="translate(50, 470)">
    <rect width="820" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#d97706" />
    <circle cx="48" cy="45" r="22" fill="url(#badge4)" />
    <text x="48" y="51" class="badge-num" text-anchor="middle">04</text>
    <text x="86" y="38" class="card-title">【關卡 4】單一編號台帳配號與五合一目錄歸檔</text>
    <text x="86" y="64" class="card-desc">爭取案(3xxx)/參考案(6xxx)台帳配號，自動建立01~05標準五合一子目錄入庫</text>
    <rect x="685" y="28" width="115" height="34" rx="17" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" />
    <text x="742" y="50" class="pill-text" fill="#b45309" text-anchor="middle">更新 RTCCF_v1</text>
  </g>

  <!-- ================= 關卡 5 ================= -->
  <g transform="translate(50, 595)">
    <rect width="820" height="90" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#ea580c" />
    <circle cx="48" cy="45" r="22" fill="url(#badge5)" />
    <text x="48" y="51" class="badge-num" text-anchor="middle">05</text>
    <text x="86" y="38" class="card-title">【關卡 5】標案管理總表動態維護與更正異動追蹤</text>
    <text x="86" y="64" class="card-desc">串聯決策與領標更新管理總表，發布交付通知，追蹤更正公告並版本另存於04目錄</text>
    <rect x="685" y="28" width="115" height="34" rx="17" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2" />
    <text x="742" y="50" class="pill-text" fill="#c2410c" text-anchor="middle">終極 RTCCF_v1</text>
  </g>
</svg>
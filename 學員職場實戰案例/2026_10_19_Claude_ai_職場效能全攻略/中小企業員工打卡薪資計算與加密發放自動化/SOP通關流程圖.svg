<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="100%" height="100%">
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 800; fill: #ffffff; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; font-size: 18px; fill: #ffffff; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 500; font-size: 13.5px; fill: #cbd5e1; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; }
    .card { rx: 18px; filter: url(#cardShadow); }
  </style>

  <!-- 主背景底板 -->
  <rect x="0" y="0" width="880" height="660" rx="28" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" />

  <!-- 頂部標題與光暈 -->
  <circle cx="440" cy="40" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
  <text x="440" y="46" class="title-text" font-size="23" text-anchor="middle" letter-spacing="1.5">🧭 漸進式優化通關地圖：工作流演進全景</text>
  <text x="440" y="72" class="step-desc" font-size="13" text-anchor="middle" fill="#94a3b8">自然語言發想 ➔ 產出 RTCCF.md 規格 ➔ 依工作流執行 ➔ 逐關推進 ➔ 工作流愈長愈強大</text>

  <!-- 連接導引箭頭線 -->
  <path d="M 440, 190 L 440, 220" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
  <polygon points="434,220 446,220 440,230" fill="#c084fc" />

  <path d="M 440, 325 L 440, 355" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
  <polygon points="434,355 446,355 440,365" fill="#c084fc" />

  <path d="M 440, 460 L 440, 490" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
  <polygon points="434,490 446,490 440,500" fill="#c084fc" />

  <!-- ================= 關卡 1 ================= -->
  <g transform="translate(65, 95)">
    <rect width="750" height="95" class="card" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8" />
    <rect x="0" y="0" width="10" height="95" rx="5" fill="url(#cardGrad1)" />
    <circle cx="56" cy="47" r="24" fill="url(#cardGrad1)" />
    <text x="56" y="53" class="badge-text" text-anchor="middle">01</text>
    <text x="96" y="38" class="step-title">【關卡 1】產出首版 RTCCF.md 規格書 ➔ 依工作流開始計薪</text>
    <text x="96" y="65" class="step-desc">自然語言發想 ➔ 產出純規格書 <tspan fill="#60a5fa" font-weight="700">RTCCF.md</tspan> ➔ 指示 AI 依規格執行打卡統計與 2026 計薪</text>
    <rect x="625" y="32" width="105" height="32" rx="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <text x="677" y="53" class="step-desc" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">產出首版工作流</text>
  </g>

  <!-- ================= 關卡 2 ================= -->
  <g transform="translate(65, 230)">
    <rect width="750" height="95" class="card" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8" />
    <rect x="0" y="0" width="10" height="95" rx="5" fill="url(#cardGrad2)" />
    <circle cx="56" cy="47" r="24" fill="url(#cardGrad2)" />
    <text x="56" y="53" class="badge-text" text-anchor="middle">02</text>
    <text x="96" y="38" class="step-title">【關卡 2】財務薪資傳票與會計借貸平衡（工作流開始變長）</text>
    <text x="96" y="65" class="step-desc">自然語言執行傳票分錄 ➔ 驗收 100% 借貸平衡 ➔ <tspan fill="#c084fc" font-weight="700">追加寫回 RTCCF.md（工作流變長）</tspan></text>
    <rect x="625" y="32" width="105" height="32" rx="16" fill="#3b0764" stroke="#8b5cf6" stroke-width="1" />
    <text x="677" y="53" class="step-desc" font-size="12" font-weight="700" fill="#d8b4fe" text-anchor="middle">工作流擴充 +1</text>
  </g>

  <!-- ================= 關卡 3 ================= -->
  <g transform="translate(65, 365)">
    <rect width="750" height="95" class="card" fill="#1e293b" stroke="#ec4899" stroke-width="1.8" />
    <rect x="0" y="0" width="10" height="95" rx="5" fill="url(#cardGrad3)" />
    <circle cx="56" cy="47" r="24" fill="url(#cardGrad3)" />
    <text x="56" y="53" class="badge-text" text-anchor="middle">03</text>
    <text x="96" y="38" class="step-title">【關卡 3】批次產出個人身分證 AES-256 加密 PDF 薪資單</text>
    <text x="96" y="65" class="step-desc">自然語言執行批次加密腳本 ➔ 驗收身分證解鎖防窺 ➔ <tspan fill="#f472b6" font-weight="700">追加寫回 RTCCF.md（工作流再變長）</tspan></text>
    <rect x="625" y="32" width="105" height="32" rx="16" fill="#500724" stroke="#ec4899" stroke-width="1" />
    <text x="677" y="53" class="step-desc" font-size="12" font-weight="700" fill="#fbcfe8" text-anchor="middle">工作流擴充 +2</text>
  </g>

  <!-- ================= 關卡 4 ================= -->
  <g transform="translate(65, 500)">
    <rect width="750" height="95" class="card" fill="#1e293b" stroke="#10b981" stroke-width="1.8" />
    <rect x="0" y="0" width="10" height="95" rx="5" fill="url(#cardGrad4)" />
    <circle cx="56" cy="47" r="24" fill="url(#cardGrad4)" />
    <text x="56" y="53" class="badge-text" text-anchor="middle">04</text>
    <text x="96" y="38" class="step-title">【關卡 4】年度所得與特休結算 ➔ 收斂為終極生產級工作流</text>
    <text x="96" y="65" class="step-desc">自然語言折算特休與所得分流 ➔ 最終收斂為 <tspan fill="#34d399" font-weight="700">終極生產級 RTCCF.md</tspan>（四大模組齊備）</text>
    <rect x="625" y="32" width="105" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="677" y="53" class="step-desc" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">終極工作流</text>
  </g>
</svg>

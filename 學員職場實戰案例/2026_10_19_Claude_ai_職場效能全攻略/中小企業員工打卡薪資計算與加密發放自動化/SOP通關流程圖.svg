<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 670" width="100%" height="100%">
  <defs>
    <!-- 亮色風格漸層定義 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- 序號徽章漸層 -->
    <linearGradient id="badge1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="badge2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="badge3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="badge4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 亮色精緻卡片投影 -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 800; font-size: 22px; fill: #0f172a; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; font-size: 17px; fill: #0f172a; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 400; font-size: 13px; fill: #475569; }
    .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; font-size: 13px; }
  </style>

  <!-- 主背景底板（清新亮色） -->
  <rect x="0" y="0" width="920" height="670" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- 頂部標題區 -->
  <text x="460" y="46" class="main-title" text-anchor="middle" letter-spacing="0.8">🧭 漸進式優化通關地圖：工作流演進全景</text>
  <text x="460" y="72" class="sub-title" text-anchor="middle">自然語言發想 ➔ 產出首版規格書 ➔ 依規格算薪 ➔ 逐關推進 ➔ 工作流愈長愈強大</text>

  <!-- 連接導引箭頭線 -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" fill="none">
    <path d="M 460, 200 L 460, 225" />
    <path d="M 460, 335 L 460, 360" />
    <path d="M 460, 470 L 460, 495" />
  </g>
  <polygon points="455,225 465,225 460,233" fill="#64748b" />
  <polygon points="455,360 465,360 460,368" fill="#64748b" />
  <polygon points="455,495 465,495 460,503" fill="#64748b" />

  <!-- ================= 關卡 1 ================= -->
  <g transform="translate(50, 100)">
    <!-- 卡片本體 (寬 820, 高 100) -->
    <rect width="820" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <!-- 左側顏色條 -->
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#3b82f6" />
    <!-- 圓形序號徽章 -->
    <circle cx="50" cy="50" r="23" fill="url(#badge1)" />
    <text x="50" y="56" class="badge-num" text-anchor="middle">01</text>
    <!-- 標題與內文（x 從 90 開始，最大寬度 580，距右標籤 685 有 95px 安全距離） -->
    <text x="90" y="41" class="card-title">【關卡 1】建立基礎工作流 ➔ 依規格執行出勤計薪</text>
    <text x="90" y="69" class="card-desc">自然語言發想產出首版規格書，檢核後再指示 AI 讀表執行工時統計與 2026 計薪</text>
    <!-- 右側膠囊標籤 (x=685, 寬 115) -->
    <rect x="685" y="33" width="115" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" />
    <text x="742" y="55" class="pill-text" fill="#1d4ed8" text-anchor="middle">RTCCF_v1.md</text>
  </g>

  <!-- ================= 關卡 2 ================= -->
  <g transform="translate(50, 235)">
    <rect width="820" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#8b5cf6" />
    <circle cx="50" cy="50" r="23" fill="url(#badge2)" />
    <text x="50" y="56" class="badge-num" text-anchor="middle">02</text>
    <text x="90" y="41" class="card-title">【關卡 2】財務薪資傳票分錄與會計借貸平衡</text>
    <text x="90" y="69" class="card-desc">自然語言切傳票並驗收 100% 借貸平衡，將會計規則追加擴充寫回工作流（變長了）</text>
    <rect x="685" y="33" width="115" height="34" rx="17" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" />
    <text x="742" y="55" class="pill-text" fill="#6d28d9" text-anchor="middle">RTCCF_v2.md</text>
  </g>

  <!-- ================= 關卡 3 ================= -->
  <g transform="translate(50, 370)">
    <rect width="820" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#ec4899" />
    <circle cx="50" cy="50" r="23" fill="url(#badge3)" />
    <text x="50" y="56" class="badge-num" text-anchor="middle">03</text>
    <text x="90" y="41" class="card-title">【關卡 3】批次產出個人身分證 AES-256 加密薪資單</text>
    <text x="90" y="69" class="card-desc">自然語言執行 Python 批次腳本並驗收密碼防窺，將資安加密規格追加擴充寫回</text>
    <rect x="685" y="33" width="115" height="34" rx="17" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.2" />
    <text x="742" y="55" class="pill-text" fill="#be185d" text-anchor="middle">RTCCF_v3.md</text>
  </g>

  <!-- ================= 關卡 4 ================= -->
  <g transform="translate(50, 505)">
    <rect width="820" height="100" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#softShadow)" />
    <rect x="0" y="0" width="6" height="100" rx="3" fill="#10b981" />
    <circle cx="50" cy="50" r="23" fill="url(#badge4)" />
    <text x="50" y="56" class="badge-num" text-anchor="middle">04</text>
    <text x="90" y="41" class="card-title">【關卡 4】年度所得扣繳統計與曆年制特休折現工資</text>
    <text x="90" y="69" class="card-desc">自然語言結算所得與特休，最終整合四大模組，收斂為生產級全自動作業 SOP</text>
    <rect x="685" y="33" width="115" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="742" y="55" class="pill-text" fill="#047857" text-anchor="middle">RTCCF_v4.md</text>
  </g>
</svg>

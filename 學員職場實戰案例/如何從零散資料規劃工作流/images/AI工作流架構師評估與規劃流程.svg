<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="100%" height="100%">
  <defs>
    <!-- 箭頭標記（純向量，色彩飽滿，銳利無毛邊） -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>

    <!-- 漸層定義 -->
    <linearGradient id="grad-green-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="grad-red-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="grad-bottom-cta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
    }
    .main-title { font-size: 24px; font-weight: 800; fill: #0F172A; text-anchor: middle; letter-spacing: 0.5px; }
    .sub-title { font-size: 13.5px; font-weight: 500; fill: #64748B; text-anchor: middle; }
    .card-title { font-size: 16px; font-weight: 700; text-anchor: middle; }
    .card-body { font-size: 13.5px; font-weight: 500; fill: #334155; }
    .card-desc { font-size: 12.5px; font-weight: 400; fill: #64748B; }
    .badge-text { font-size: 13px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .branch-tag { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .list-title { font-size: 14.5px; font-weight: 700; fill: #0F172A; }
    .list-desc { font-size: 12.5px; font-weight: 400; fill: #475569; }
    .num-pill { font-size: 12px; font-weight: 800; fill: #047857; text-anchor: middle; }
  </style>

  <!-- 外框畫布底色（清晰高對比純向量） -->
  <rect x="0" y="0" width="1000" height="880" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>

  <!-- 頂部主標題與副標題 -->
  <text x="500" y="44" class="main-title">AI 工作流總架構師：從零散素材到漸進式工作流評估閉環</text>
  <text x="500" y="68" class="sub-title">AI Workflow Feasibility Assessment &amp; Blueprint Architecture Flow</text>

  <!-- ==================== 步驟 1：學員準備素材 ==================== -->
  <g transform="translate(260, 95)">
    <!-- 向量陰影底層（無模糊濾鏡，絕不降解析度光柵化） -->
    <rect x="2" y="3" width="480" height="92" rx="12" fill="#E2E8F0"/>
    <!-- 卡片主體 -->
    <rect x="0" y="0" width="480" height="92" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="0" y="0" width="480" height="6" rx="3" fill="#2563EB"/>
    
    <text x="240" y="33" class="card-title" fill="#1E40AF">📂 步驟一：學員準備手邊現有零散素材</text>
    <text x="240" y="58" class="card-body" text-anchor="middle">1. 業務原始檔：Excel / Word / PDF 規程 / 報表白板圖</text>
    <text x="240" y="78" class="card-desc" text-anchor="middle">2. 口述說明：痛點困擾、業務流程規則與預期最終成果</text>
  </g>

  <!-- 箭頭 1 -> 2 -->
  <line x1="500" y1="190" x2="500" y2="222" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================== 步驟 2：啟動 AI 總架構師 ==================== -->
  <g transform="translate(240, 226)">
    <!-- 向量陰影底層 -->
    <rect x="2" y="3" width="520" height="96" rx="12" fill="#E2E8F0"/>
    <!-- 卡片主體 -->
    <rect x="0" y="0" width="520" height="96" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="2"/>
    <rect x="0" y="0" width="520" height="6" rx="3" fill="#4F46E5"/>

    <text x="260" y="33" class="card-title" fill="#312E81">🤖 步驟二：啟動 AI 工作流總架構師審查</text>
    <text x="260" y="58" class="card-body" fill="#4338CA" text-anchor="middle">開啟對話框，上傳檔案並複製【01_AI工作流架構師評估提示詞】</text>
    <text x="260" y="78" class="card-desc" text-anchor="middle">AI 全面盤點：資料齊全度、動態/靜態解耦、單關閉環或多關漸進</text>
  </g>

  <!-- 箭頭 2 -> 決策徽章 -->
  <line x1="500" y1="325" x2="500" y2="355" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>

  <!-- 決策判定核心徽章 -->
  <g transform="translate(400, 358)">
    <rect x="1" y="2" width="200" height="38" rx="19" fill="#1E1B4B"/>
    <rect x="0" y="0" width="200" height="38" rx="19" fill="#4338CA"/>
    <text x="100" y="24" class="badge-text">🔍 審查資料齊全度？</text>
  </g>

  <!-- ==================== 分流折線與路徑標籤 ==================== -->
  <!-- 左分流（紅/黃燈） -->
  <path d="M 400 377 L 240 377 L 240 422" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="250" y="360" width="135" height="24" rx="12" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="317" y="376" class="branch-tag" fill="#B91C1C">🔴 缺漏 / 🟡 缺對照表</text>

  <!-- 右分流（綠燈合格） -->
  <path d="M 600 377 L 760 377 L 760 422" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="615" y="360" width="135" height="24" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="682" y="376" class="branch-tag" fill="#047857">🟢 核心素材 100% 齊全</text>

  <!-- ==================== 支線 A：缺漏阻斷警示卡片 ==================== -->
  <g transform="translate(50, 426)">
    <!-- 向量陰影底層 -->
    <rect x="2" y="3" width="380" height="230" rx="14" fill="#FEE2E2"/>
    <!-- 卡片主體 -->
    <rect x="0" y="0" width="380" height="230" rx="14" fill="#FFF5F5" stroke="#F87171" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="36" rx="14" fill="url(#grad-red-header)"/>
    <text x="190" y="24" class="badge-text">🚨 阻斷警示：資料不足，嚴禁硬做！</text>

    <text x="24" y="64" class="card-body" font-weight="700" fill="#991B1B">⚠️ AI 亮紅/黃燈，避免隨機幻覺或空轉：</text>
    <text x="24" y="88" class="card-desc" fill="#7F1D1D">• 輸出【缺漏清單】：明確指認缺什麼對照表或標準</text>
    <text x="24" y="110" class="card-desc" fill="#7F1D1D">• 阻斷影響分析：詳細說明缺少該表會卡在哪個關卡</text>
    <text x="24" y="132" class="card-desc" fill="#7F1D1D">• 補齊指導：建議向誰索取、範本規格或替代欄位</text>

    <!-- 底部操作提示 -->
    <rect x="20" y="152" width="340" height="60" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="190" y="176" class="card-body" font-weight="700" fill="#B91C1C" text-anchor="middle">👉 學員備齊缺漏素材後，重新上傳評估</text>
    <text x="190" y="198" class="card-desc" fill="#991B1B" text-anchor="middle">（形成自主把關閉環，不在缺陷基礎上蓋危樓）</text>
  </g>

  <!-- 支線 A 繞回步驟 1 的回調虛線箭頭 -->
  <path d="M 50 541 L 20 541 L 20 141 L 254 141" fill="none" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="6" y="270" width="28" height="140" rx="6" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="20" y="288" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">
    <tspan x="20" dy="0">補</tspan>
    <tspan x="20" dy="16">齊</tspan>
    <tspan x="20" dy="16">資</tspan>
    <tspan x="20" dy="16">料</tspan>
    <tspan x="20" dy="16">重</tspan>
    <tspan x="20" dy="16">新</tspan>
    <tspan x="20" dy="16">評</tspan>
    <tspan x="20" dy="16">估</tspan>
  </text>

  <!-- ==================== 支線 B：合格產出規劃報告 ==================== -->
  <g transform="translate(480, 426)">
    <!-- 向量陰影底層 -->
    <rect x="2" y="3" width="470" height="340" rx="14" fill="#D1FAE5"/>
    <!-- 卡片主體 -->
    <rect x="0" y="0" width="470" height="340" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>
    <rect x="0" y="0" width="470" height="38" rx="14" fill="url(#grad-green-header)"/>
    <text x="235" y="25" class="badge-text">🎉 審查通過！產出《工作流可行性規劃報告.md》</text>

    <!-- 1. 專案名稱 -->
    <g transform="translate(24, 52)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="16" class="num-pill">1</text>
      <text x="34" y="17" class="list-title">收斂專案主題與商業價值</text>
      <text x="34" y="35" class="list-desc">擺脫模糊口語，定義具備可量化效益之正式專案標題</text>
    </g>

    <!-- 2. 資料解耦架構 -->
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="16" class="num-pill">2</text>
      <text x="34" y="17" class="list-title">資料解耦架構（極致節省 Token）</text>
      <text x="34" y="35" class="list-desc">明確分離「固定資料表（知識庫常駐）」與「動態輸入（每期上傳）」</text>
    </g>

    <!-- 3. 關卡規劃 -->
    <g transform="translate(24, 144)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="16" class="num-pill">3</text>
      <text x="34" y="17" class="list-title">關卡規劃：單關閉環或多關漸進</text>
      <text x="34" y="35" class="list-desc">單純任務 1 關搞定！複雜多表才切 2~5 關，嚴禁無意義過度包裝</text>
    </g>

    <!-- 4. 各關 Prompt 與交付物 -->
    <g transform="translate(24, 190)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="16" class="num-pill">4</text>
      <text x="34" y="17" class="list-title">各關建議 Prompt 與真實交付物規格</text>
      <text x="34" y="35" class="list-desc">含口語提示詞，並定義實體格式（XLSX / DOCX / PDF / TXT / PPTX）</text>
    </g>

    <!-- 5. 驗收標準 Checklist -->
    <g transform="translate(24, 236)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="16" class="num-pill">5</text>
      <text x="34" y="17" class="list-title">各關卡客觀驗收標準（Checklist）</text>
      <text x="34" y="35" class="list-desc">3~5 項具體驗收條件，確保 AI 產出可比對、零隨機誤差</text>
    </g>

    <!-- 6. 工作流規格書演進 -->
    <g transform="translate(24, 282)">
      <rect x="0" y="0" width="24" height="24" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="12" y="16" class="num-pill">6</text>
      <text x="34" y="17" class="list-title">工作流規格書演進路徑（RTCCF 閉環）</text>
      <text x="34" y="35" class="list-desc">依規劃報告建立規格書，並隨執行逐步調優收斂，達成全面自動化</text>
    </g>
  </g>

  <!-- 箭頭：從報告連向終點 -->
  <path d="M 715 768 L 715 798 L 505 798 L 505 812" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- ==================== 步驟 3：終點里程碑 ==================== -->
  <g transform="translate(200, 814)">
    <!-- 向量陰影底層 -->
    <rect x="2" y="3" width="600" height="50" rx="25" fill="#BFDBFE"/>
    <!-- 藥丸膠囊外觀 -->
    <rect x="0" y="0" width="600" height="50" rx="25" fill="url(#grad-bottom-cta)" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="300" y="31" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5px">
      🚀 學員依循報告藍圖，步步建構專屬高產能企業級工作流！
    </text>
  </g>
</svg>
